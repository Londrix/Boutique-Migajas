version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Base de Datos Central (Servidor Coordinador Federado)
  # -------------------------------------------------------------
  db_central:
    image: postgres:15-alpine
    container_name: migajas_db_central
    restart: always
    environment:
      POSTGRES_DB: ${CENTRAL_DB_NAME}
      POSTGRES_USER: ${CENTRAL_DB_USER}
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD}
    ports:
      - "5436:5432"  # Puerto estándar para la Central
    volumes:
      - postgres_central_data:/var/lib/postgresql/data
    networks:
      - migajas_network

  # -------------------------------------------------------------
  # 2. Base de Datos Sucursal A (Nodo Local 1)
  # -------------------------------------------------------------
  db_sucursal_a:
    image: postgres:15-alpine
    container_name: migajas_db_sucursal_a
    restart: always
    environment:
      POSTGRES_DB: ${SUCURSAL_A_DB_NAME}
      POSTGRES_USER: ${SUCURSAL_A_DB_USER}
      POSTGRES_PASSWORD: ${SUCURSAL_A_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_sucursal_a_data:/var/lib/postgresql/data
    networks:
      - migajas_network

  # -------------------------------------------------------------
  # 3. Base de Datos Sucursal B (Nodo Local 2)
  # -------------------------------------------------------------
  db_sucursal_b:
    image: postgres:15-alpine
    container_name: migajas_db_sucursal_b
    restart: always
    environment:
      POSTGRES_DB: ${SUCURSAL_B_DB_NAME}
      POSTGRES_USER: ${SUCURSAL_B_DB_USER}
      POSTGRES_PASSWORD: ${SUCURSAL_B_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_sucursal_b_data:/var/lib/postgresql/data
    networks:
      - migajas_network

  # -------------------------------------------------------------
  # 4. Base de Datos Sucursal C (Nodo Local 3)
  # -------------------------------------------------------------
  db_sucursal_c:
    image: postgres:15-alpine
    container_name: migajas_db_sucursal_c
    restart: always
    environment:
      POSTGRES_DB: ${SUCURSAL_C_DB_NAME}
      POSTGRES_USER: ${SUCURSAL_C_DB_USER}
      POSTGRES_PASSWORD: ${SUCURSAL_C_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_sucursal_c_data:/var/lib/postgresql/data
    networks:
      - migajas_network

  # -------------------------------------------------------------
  # 5. Interfaz Gráfica (pgAdmin 4)
  # -------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: migajas_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - migajas_network
    depends_on:
      - db_central
      - db_sucursal_a
      - db_sucursal_b
      - db_sucursal_c

# -------------------------------------------------------------
# Volúmenes Persistentes y Red Compartida
# -------------------------------------------------------------
volumes:
  postgres_central_data:
  postgres_sucursal_a_data:
  postgres_sucursal_b_data:
  postgres_sucursal_c_data:
  pgadmin_data:

networks:
  migajas_network:
    driver: bridge