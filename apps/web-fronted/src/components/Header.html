<header id="site-header" class="bm-header">

  <!-- ── TOP BAR ─────────────────────────────────────────── -->
  <div class="bm-header__topbar">

    <!-- Búsqueda (izquierda) -->
    <button class="bm-header__icon-btn" id="btn-search" aria-label="Buscar">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="22" y2="22"/>
      </svg>
    </button>

    <!-- Logo (centro) -->
    <a href="index.html" class="bm-header__logo" aria-label="Boutique Migajas – Inicio">
      <!--
        REEMPLAZA esta sección con tu logo real:
        <img src="../assets/images/logo-boutique-migajas.svg"
             alt="Boutique Migajas" class="bm-header__logo-img" />
      -->
      <div class="bm-header__logo-placeholder">
        <span class="bm-header__logo-name">Boutique Migajas</span>
        <span class="bm-header__logo-tagline">Estilo &amp; Bienestar</span>
      </div>
    </a>

    <!-- Carrito (derecha) -->
    <button class="bm-header__icon-btn" id="btn-cart" aria-label="Carrito de compras">
      <span class="bm-header__cart-badge" id="cart-count" aria-live="polite">0</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
        <path d="M6 2 3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
    </button>

  </div><!-- /.bm-header__topbar -->

  <!-- ── SEARCH BAR (oculta por defecto) ──────────────────── -->
  <div class="bm-header__search-bar" id="search-bar" aria-hidden="true">
    <form class="bm-header__search-form" role="search" id="search-form">
      <input
        type="search"
        id="search-input"
        name="q"
        placeholder="Buscar prendas, colecciones…"
        class="bm-header__search-input"
        autocomplete="off"
        aria-label="Campo de búsqueda"
      />
      <button type="submit" class="bm-header__search-btn" aria-label="Realizar búsqueda">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="22" y2="22"/>
        </svg>
      </button>
    </form>
  </div><!-- /.bm-header__search-bar -->

  <!-- ── NAVIGATION ───────────────────────────────────────── -->
  <nav class="bm-nav" aria-label="Menú principal">

    <!-- Hamburger (mobile) -->
    <button class="bm-nav__hamburger" id="btn-hamburger" aria-label="Abrir menú" aria-expanded="false">
      <span class="bm-nav__hamburger-line"></span>
      <span class="bm-nav__hamburger-line"></span>
      <span class="bm-nav__hamburger-line"></span>
    </button>

    <!-- Nav links -->
    <ul class="bm-nav__list" id="nav-list" role="list">
      <li class="bm-nav__item">
        <a href="index.html" class="bm-nav__link bm-nav__link--active" aria-current="page">Inicio</a>
      </li>
      <li class="bm-nav__item">
        <a href="blusas.html" class="bm-nav__link">Blusas</a>
      </li>
      <li class="bm-nav__item">
        <a href="vestidos.html" class="bm-nav__link">Vestidos</a>
      </li>
      <li class="bm-nav__item">
        <a href="conjuntos.html" class="bm-nav__link">Conjuntos</a>
      </li>
      <li class="bm-nav__item">
        <a href="pantalones-faldas.html" class="bm-nav__link">Pantalones / Faldas</a>
      </li>
      <li class="bm-nav__item bm-nav__item--highlight">
        <a href="novedades.html" class="bm-nav__link">Novedades</a>
      </li>
      <li class="bm-nav__item">
        <a href="nosotros.html" class="bm-nav__link">Nosotros</a>
      </li>
    </ul><!-- /.bm-nav__list -->

  </nav><!-- /.bm-nav -->

</header><!-- /#site-header -->
